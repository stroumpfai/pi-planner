<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PI Planning — Wireframes</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Caveat+Brush&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f5f3ef; font-family: 'Caveat', cursive; }

  /* Sketch global styles */
  .sk-box {
    border: 2px solid #222;
    border-radius: 3px;
    background: #fff;
  }
  .sk-box-dash {
    border: 2px dashed #888;
    border-radius: 3px;
    background: #fafafa;
  }
  .sk-label {
    font-family: 'Caveat', cursive;
    font-size: 13px;
    color: #444;
  }
  .sk-label-sm {
    font-family: 'Caveat', cursive;
    font-size: 11px;
    color: #666;
  }
  .sk-title {
    font-family: 'Caveat', cursive;
    font-size: 16px;
    font-weight: 700;
    color: #111;
  }
  .sk-section {
    font-family: 'Caveat', cursive;
    font-size: 12px;
    font-weight: 600;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .sk-btn {
    border: 2px solid #222;
    border-radius: 3px;
    background: #fff;
    font-family: 'Caveat', cursive;
    font-size: 13px;
    padding: 2px 8px;
    cursor: default;
    display: inline-block;
  }
  .sk-btn-fill {
    background: #222;
    color: #fff;
  }
  .sk-btn-amber {
    background: #f5a623;
    color: #111;
    border-color: #c07d0a;
  }
  .sk-chip {
    border: 1.5px solid #aaa;
    border-radius: 10px;
    background: #f0efed;
    font-family: 'Caveat', cursive;
    font-size: 11px;
    padding: 1px 7px;
    display: inline-block;
    color: #444;
  }
  .sk-chip-amber {
    background: #fef3d7;
    border-color: #e5a200;
    color: #8a5c00;
  }
  .sk-chip-warn {
    background: #fff3cd;
    border-color: #f0ad4e;
    color: #7a4e00;
  }
  .sk-badge-warn {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: #fff3cd;
    border: 1.5px solid #f0ad4e;
    border-radius: 3px;
    font-size: 11px;
    padding: 0 4px;
    color: #8a5c00;
  }
  .sk-sprint-col {
    border-left: 2px solid #ddd;
    flex: 1;
    min-width: 0;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .sk-sprint-head {
    background: #f0efed;
    border: 1.5px solid #ccc;
    border-radius: 2px;
    padding: 3px 5px;
    font-size: 12px;
    font-family: 'Caveat', cursive;
    text-align: center;
  }
  .sk-feature-pill {
    background: #e8e5e0;
    border: 2px solid #bbb;
    border-radius: 3px;
    padding: 3px 6px;
    font-size: 12px;
    font-family: 'Caveat', cursive;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
  }
  .sk-group-card {
    background: #fff;
    border: 2px solid #888;
    border-radius: 3px;
    padding: 4px 6px;
    font-size: 11px;
    font-family: 'Caveat', cursive;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .sk-pbi-row {
    background: #f7f6f4;
    border: 1.5px solid #ccc;
    border-radius: 2px;
    padding: 2px 5px;
    font-size: 11px;
    font-family: 'Caveat', cursive;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sk-swimlane {
    border: 2px solid #ccc;
    border-radius: 3px;
    background: #faf9f7;
    display: flex;
    flex-direction: row;
    min-height: 80px;
  }
  .sk-swimlane-label {
    writing-mode: vertical-lr;
    transform: rotate(180deg);
    font-size: 12px;
    font-family: 'Caveat', cursive;
    font-weight: 600;
    color: #555;
    background: #eee;
    border-right: 2px solid #ccc;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    min-width: 22px;
    text-align: center;
  }
  .sk-feature-zone {
    border-right: 2px solid #ccc;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: #f0eeea;
  }
  .sk-annotation {
    font-family: 'Caveat', cursive;
    font-size: 11px;
    color: #e07b00;
    border-bottom: 1px dashed #e07b00;
    display: inline-block;
  }
  .sk-arrow {
    color: #888;
    font-size: 13px;
  }
  .sk-divider {
    border: none;
    border-top: 2px dashed #ccc;
    margin: 6px 0;
  }
  .sk-lock-banner {
    background: #fff3cd;
    border: 2px solid #f0ad4e;
    border-radius: 3px;
    padding: 4px 8px;
    font-size: 12px;
    font-family: 'Caveat', cursive;
    display: flex;
    align-items: center;
    gap: 6px;
    color: #7a4e00;
  }
</style>
</head>
<body>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel">

/* ─── Shared mini-components ─────────────────────────────── */

const Warn = ({ small }) => (
  <span style={{fontSize: small ? 10 : 12, color:'#d97706', display:'inline-block'}}>⚠</span>
);
const Dep = () => <span style={{fontSize:10, color:'#888', border:'1px solid #bbb', borderRadius:2, padding:'0 3px', background:'#f5f5f5'}}>→</span>;
const Effort = ({n}) => <span style={{fontSize:10, color:'#555', background:'#e8e5e0', border:'1px solid #ccc', borderRadius:10, padding:'0 5px'}}>{n}pts</span>;

const SkBtn = ({children, fill, amber}) => (
  <span className={`sk-btn${fill?' sk-btn-fill':''}${amber?' sk-btn-amber':''}`}>{children}</span>
);

const SprintHead = ({n, cap, used, dates}) => (
  <div style={{textAlign:'center', padding:'4px 2px', borderBottom:'2px solid #ddd', background:'#f5f3ef'}}>
    <div style={{fontWeight:700, fontSize:13}}>Sprint {n}</div>
    <div style={{fontSize:10, color:'#888'}}>{dates}</div>
    <div style={{fontSize:10}}>
      <span style={{color: used > cap ? '#c00':'#555'}}>∑{used}</span>
      <span style={{color:'#aaa'}}> / cap {cap}</span>
    </div>
  </div>
);

const GroupCard = ({name, effort, pbis, warn}) => (
  <div className="sk-group-card" style={{marginTop:2}}>
    <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', gap:4}}>
      <span style={{fontWeight:600, fontSize:12}}>{name}</span>
      <span style={{display:'flex', alignItems:'center', gap:3}}>
        {warn && <Warn small />}
        <Effort n={effort} />
      </span>
    </div>
    {pbis.map((p,i) => (
      <div key={i} className="sk-pbi-row">
        <span>{p.title}</span>
        <span style={{display:'flex',gap:3}}>
          {p.dep && <Dep/>}
          {p.warn && <Warn small/>}
          {p.effort && <Effort n={p.effort}/>}
        </span>
      </div>
    ))}
  </div>
);

const FeaturePill = ({title, effort, warn}) => (
  <div className="sk-feature-pill">
    <span style={{fontWeight:600, fontSize:12, overflow:'hidden', whiteSpace:'nowrap', textOverflow:'ellipsis', maxWidth:80}}>{title}</span>
    <span style={{display:'flex', alignItems:'center', gap:3}}>
      {warn && <Warn small/>}
      <Effort n={effort}/>
    </span>
  </div>
);

const SearchBar = () => (
  <div style={{display:'flex', gap:4, alignItems:'center'}}>
    <div style={{flex:1, border:'2px solid #bbb', borderRadius:3, padding:'3px 8px', fontSize:12, color:'#aaa', background:'#fff'}}>🔍 search...</div>
    <SkBtn>A–Z</SkBtn>
  </div>
);

const BacklogFeature = ({title, id, effort, pbis, warn, expanded}) => (
  <div style={{marginBottom:6}}>
    <div className="sk-box" style={{padding:'5px 8px', display:'flex', gap:6, alignItems:'center'}}>
      <span style={{color:'#aaa', fontSize:14}}>{expanded ? '▾' : '▸'}</span>
      <span style={{fontWeight:700, fontSize:14, flex:1}}>{title}</span>
      {id && <span style={{fontSize:10, color:'#aaa'}}>#{id}</span>}
      {warn && <Warn/>}
      {effort && <Effort n={effort}/>}
      <span style={{fontSize:11, color:'#aaa'}}>···</span>
    </div>
    {expanded && pbis && pbis.map((p,i) => (
      <div key={i} className="sk-pbi-row" style={{marginLeft:18, marginTop:3, borderRadius:3}}>
        <span style={{flex:1}}>{p.title}</span>
        {p.id && <span style={{fontSize:10, color:'#aaa', marginRight:4}}>#{p.id}</span>}
        {p.warn && <Warn small/>}
        {p.dep && <Dep/>}
        {p.effort && <Effort n={p.effort}/>}
        <span style={{fontSize:11, color:'#aaa', marginLeft:4}}>···</span>
      </div>
    ))}
  </div>
);

const PITabs = ({active}) => {
  const tabs = ['Backlog','PI-24Q1 ✓','PI-24Q2 ●','PI-24Q3 ◎'];
  return (
    <div style={{display:'flex', gap:0, borderBottom:'2px solid #222'}}>
      {tabs.map((t,i) => (
        <div key={i} style={{
          padding:'4px 12px', fontSize:13, fontWeight: t===active?700:400,
          background: t===active?'#fff':'transparent',
          borderTop: t===active?'2px solid #222':'2px solid transparent',
          borderLeft: t===active?'2px solid #222':'2px solid transparent',
          borderRight: t===active?'2px solid #222':'2px solid transparent',
          borderBottom: t===active?'2px solid #fff':'none',
          marginBottom: t===active?'-2px':0,
          color: t.includes('✓')?'#888': t.includes('●')?'#c07d0a':'#222',
          cursor:'default'
        }}>{t}</div>
      ))}
      <div style={{flex:1}}></div>
      <div style={{padding:'4px 8px', fontSize:12, color:'#888', alignSelf:'center'}}>+ New PI</div>
    </div>
  );
};

const EditLockBanner = ({user}) => user ? (
  <div className="sk-lock-banner">
    <span>✏️</span>
    <span><b>{user}</b> is editing · read-only for you</span>
    <span style={{flex:1}}></span>
    <span style={{fontSize:11, color:'#a36200'}}>lock expires ~14 min</span>
  </div>
) : (
  <div style={{display:'flex', alignItems:'center', gap:6, fontSize:12, color:'#555'}}>
    <span>🔓</span>
    <SkBtn amber>Request Edit Mode</SkBtn>
    <span style={{color:'#aaa', fontSize:11}}>read-only</span>
  </div>
);

/* ─── OPTION A: Sidebar nav + horizontal swimlanes (standard) ─── */
const OptionA = ({screen}) => {
  const showBacklog = screen === 'Backlog';
  const showImport = screen === 'CSV Import';
  const showDeps = screen === 'Dependencies';

  return (
    <div style={{display:'flex', height:'100%', border:'2.5px solid #222', borderRadius:4, overflow:'hidden', background:'#fff', fontFamily:'Caveat, cursive'}}>
      {/* Sidebar */}
      <div style={{width:130, background:'#1a1a1a', color:'#fff', display:'flex', flexDirection:'column', padding:'10px 0', gap:0, flexShrink:0}}>
        <div style={{padding:'6px 12px', fontSize:16, fontWeight:700, color:'#f5a623', borderBottom:'1px solid #333', marginBottom:8}}>PI Planner</div>
        <div style={{fontSize:11, color:'#666', padding:'0 12px', marginBottom:4, textTransform:'uppercase', letterSpacing:'0.05em'}}>Projects</div>
        {['Alpha Team','Beta Squad'].map((p,i) => (
          <div key={i} style={{padding:'5px 12px', fontSize:13, background: i===0?'#333':'transparent', color: i===0?'#fff':'#aaa', cursor:'default'}}>{p}</div>
        ))}
        <div style={{padding:'5px 12px', fontSize:12, color:'#555', cursor:'default'}}>+ new project</div>
        <div style={{padding:'4px 12px', fontSize:12, color:'#555', cursor:'default'}}>↑ import project</div>
        <div style={{padding:'4px 12px', fontSize:12, color:'#555', cursor:'default'}}>↓ export project</div>
        <hr style={{borderColor:'#333', margin:'10px 0'}}/>
        <div style={{fontSize:11, color:'#666', padding:'0 12px', marginBottom:4, textTransform:'uppercase', letterSpacing:'0.05em'}}>Views</div>
        {[
          {label:'Backlog', icon:'📋'},
          {label:'PI Board', icon:'📊'},
          {label:'Dependencies', icon:'🔗'},
        ].map((v,i) => (
          <div key={i} style={{
            padding:'5px 12px', fontSize:13, cursor:'default',
            background: (showBacklog&&v.label==='Backlog')||(showDeps&&v.label==='Dependencies')||(!showBacklog&&!showDeps&&v.label==='PI Board')?'#333':'transparent',
            color: (showBacklog&&v.label==='Backlog')||(showDeps&&v.label==='Dependencies')||(!showBacklog&&!showDeps&&v.label==='PI Board')?'#fff':'#aaa'
          }}>{v.icon} {v.label}</div>
        ))}
        <hr style={{borderColor:'#333', margin:'10px 0'}}/>
        <div style={{padding:'5px 12px', fontSize:12, color:'#555', cursor:'default'}}>⚙ Settings</div>
        <div style={{flex:1}}></div>
        <div style={{padding:'8px 12px', fontSize:12, color:'#aaa', borderTop:'1px solid #333'}}>
          <div style={{fontSize:13}}>🟢 David</div>
          <div style={{fontSize:10, color:'#555'}}>free to edit</div>
        </div>
      </div>

      {/* Main area */}
      <div style={{flex:1, display:'flex', flexDirection:'column', minWidth:0}}>
        {/* Top bar */}
        <div style={{borderBottom:'2px solid #ddd', padding:'6px 12px', display:'flex', alignItems:'center', gap:8, background:'#faf9f7'}}>
          <span style={{fontWeight:700, fontSize:15}}>Alpha Team</span>
          <span style={{color:'#aaa', fontSize:13}}>›</span>
          <span style={{fontSize:13, color:'#555'}}>{showBacklog?'Backlog':showDeps?'Dependencies':'PI Board'}</span>
          <div style={{flex:1}}></div>
          {!showBacklog && !showDeps && <SkBtn amber>+ Import CSV</SkBtn>}
          {showBacklog && <SkBtn amber>+ Import CSV</SkBtn>}
          {!showBacklog && !showDeps && <SkBtn>⊕ Add Feature</SkBtn>}
          {showBacklog && <SkBtn>⊕ Add Feature</SkBtn>}
          <EditLockBanner user={null}/>
        </div>

        {showImport && <ImportDialog/>}
        {showDeps && <DepsView/>}

        {showBacklog && !showImport && !showDeps && (
          <div style={{flex:1, padding:'10px 14px', overflowY:'auto'}}>
            <div style={{marginBottom:8}}><SearchBar/></div>
            <BacklogFeature title="User Authentication" id={1} effort={21} expanded={true} pbis={[
              {title:'Login page',id:11,effort:5,dep:false,warn:false},
              {title:'OAuth integration',id:12,effort:8,dep:false,warn:false},
              {title:'Password reset',id:13,effort:3,warn:false},
            ]}/>
            <BacklogFeature title="Dashboard MVP" id={2} effort={34} expanded={false} pbis={[]}/>
            <BacklogFeature title="Notifications" id={3} effort={13} warn={true} expanded={false} pbis={[]}/>
            <div style={{borderTop:'2px dashed #ddd', paddingTop:8, marginTop:4}}>
              <div style={{fontSize:12, color:'#aaa', marginBottom:6}}>⚠ Orphaned PBIs (missing feature)</div>
              <div className="sk-pbi-row" style={{borderColor:'#f0ad4e', background:'#fff9ef'}}><span>Old PBI without parent</span><Warn/></div>
            </div>
          </div>
        )}

        {!showBacklog && !showImport && !showDeps && (
          <div style={{flex:1, display:'flex', flexDirection:'column', minWidth:0}}>
            <div style={{padding:'6px 12px'}}>
              <PITabs active="PI-24Q3 ◎"/>
            </div>
            <div style={{display:'flex', alignItems:'center', gap:8, padding:'4px 14px', background:'#fef9f0', borderBottom:'1px dashed #ddd', fontSize:12}}>
              <span style={{color:'#f5a623'}}>◎</span> <b>PI-24Q3</b>
              <span className="sk-chip sk-chip-amber">In Progress</span>
              <span style={{color:'#aaa'}}>|</span>
              <span style={{color:'#888'}}>May 5 – Sep 26, 2024</span>
              <div style={{flex:1}}></div>
              <SkBtn>+ Swimlane</SkBtn>
              <SkBtn>+ Feature</SkBtn>
              <EditLockBanner user={null}/>
            </div>
            <PiBoardA/>
          </div>
        )}
      </div>
    </div>
  );
};

const PiBoardA = () => {
  const swimlanes = [
    {name:'Frontend', effortTotal:34, cap:60,
      features:[{title:'Auth',effort:21,warn:false},{title:'Dashboard',effort:13,warn:false}],
      sprints:[
        [{name:'Auth Group 1',effort:13,warn:false,pbis:[{title:'Login page',effort:5},{title:'OAuth',effort:8}]}],
        [{name:'Auth Group 2',effort:8,warn:false,pbis:[{title:'Pw reset',effort:3},{title:'Profile',effort:5}]}],
        [{name:'Dashboard',effort:13,warn:true,pbis:[{title:'Widget A',effort:5},{title:'Widget B',effort:8,warn:true}]}],
        [],
        [],
      ]
    },
    {name:'Backend', effortTotal:21, cap:55,
      features:[{title:'API v2',effort:21,warn:true}],
      sprints:[
        [{name:'API Setup',effort:8,warn:false,pbis:[{title:'Endpoints',effort:8}]}],
        [{name:'Auth API',effort:13,warn:true,pbis:[{title:'JWT tokens',effort:5,dep:true},{title:'Sessions',effort:8}]}],
        [],
        [],
        [],
      ]
    },
  ];
  const sprintDates = ['May 5–16','May 19–30','Jun 2–13','Jun 16–27','Jun 30–Jul 11'];
  const sprintCaps = [60,55,60,55,60];
  const sprintUsed = [21,21,13,0,0];

  return (
    <div style={{flex:1, overflowX:'auto', overflowY:'auto', padding:'8px 10px', display:'flex', flexDirection:'column', gap:6}}>
      {/* Sprint header row */}
      <div style={{display:'flex', flexDirection:'row', gap:0}}>
        <div style={{width:22, flexShrink:0}}></div>
        <div style={{width:100, flexShrink:0, background:'#eee', border:'2px solid #ccc', borderRadius:'3px 0 0 3px', padding:'4px', fontSize:11, fontWeight:600, color:'#666', display:'flex',alignItems:'center',justifyContent:'center'}}>Feature Zone</div>
        {sprintCaps.map((cap,i) => (
          <div key={i} style={{flex:1, borderLeft:'2px solid #ccc'}}>
            <SprintHead n={i+1} cap={cap} used={sprintUsed[i]} dates={sprintDates[i]}/>
          </div>
        ))}
      </div>
      {/* Swimlanes */}
      {swimlanes.map((sl,si) => (
        <div key={si} className="sk-swimlane">
          <div className="sk-swimlane-label">{sl.name}<br/><span style={{fontSize:9,color:'#aaa',writingMode:'vertical-lr'}}>∑{sl.effortTotal} / cap {sl.cap}</span></div>
          {/* Feature zone */}
          <div className="sk-feature-zone" style={{width:100, flexShrink:0}}>
            {sl.features.map((f,fi) => <FeaturePill key={fi} title={f.title} effort={f.effort} warn={f.warn}/>)}
            <div className="sk-box-dash" style={{fontSize:10,color:'#aaa',padding:'3px',textAlign:'center',minHeight:20,marginTop:2}}>drop feature</div>
          </div>
          {/* Sprint cols */}
          {sl.sprints.map((groups, spi) => (
            <div key={spi} className="sk-sprint-col">
              {groups.map((g,gi) => <GroupCard key={gi} name={g.name} effort={g.effort} pbis={g.pbis} warn={g.warn}/>)}
              {groups.length === 0 && (
                <div style={{border:'1.5px dashed #ddd', borderRadius:3, minHeight:30, display:'flex', alignItems:'center', justifyContent:'center', fontSize:10, color:'#ccc'}}>drop group</div>
              )}
            </div>
          ))}
        </div>
      ))}
      <div style={{border:'2px dashed #ddd', borderRadius:3, height:28, display:'flex', alignItems:'center', justifyContent:'center', fontSize:12, color:'#aaa', cursor:'default'}}>
        + Add swimlane
      </div>
    </div>
  );
};

/* ─── OPTION B: Top tab nav + collapsible swimlanes ─── */
const OptionB = ({screen}) => {
  const showBacklog = screen === 'Backlog';
  const showImport = screen === 'CSV Import';
  const showDeps = screen === 'Dependencies';

  return (
    <div style={{display:'flex', flexDirection:'column', height:'100%', border:'2.5px solid #222', borderRadius:4, overflow:'hidden', background:'#fff', fontFamily:'Caveat, cursive'}}>
      {/* Top nav */}
      <div style={{background:'#222', color:'#fff', padding:'6px 14px', display:'flex', alignItems:'center', gap:12}}>
        <span style={{fontWeight:700, fontSize:15, color:'#f5a623'}}>PI Planner</span>
        <span style={{color:'#555'}}>|</span>
        {['Alpha Team ▾'].map((p,i) => <span key={i} style={{fontSize:13, color:'#ccc', background:'#333', padding:'2px 8px', borderRadius:3, cursor:'default'}}>{p}</span>)}
        <div style={{flex:1}}></div>
        <EditLockBanner user={'Sarah M.'}/>
      </div>
      {/* Secondary tab bar */}
      <div style={{background:'#f0eeea', borderBottom:'2px solid #ccc', padding:'0 12px', display:'flex', gap:0, alignItems:'flex-end'}}>
        {['Backlog','PI Board','Dependencies','Settings'].map((t,i) => {
          const active = (showBacklog&&t==='Backlog')||(showDeps&&t==='Dependencies')||(!showBacklog&&!showDeps&&t==='PI Board');
          return (

        <span style={{color:'#f5a623'}}>Variant {variant}</span>
        <span style={{color:'#555', fontWeight:400, fontSize:12}}>{label}</span>
      </div>
      {/* Mini PI status bar */}
      <div style={{padding:'3px 10px', background:'#fef9f0', borderBottom:'1px dashed #e5a200', display:'flex', gap:8, alignItems:'center', fontSize:11}}>
        <span className="sk-chip sk-chip-amber">In Progress</span>
        <span style={{color:'#aaa'}}>PI-24Q3 · May 5 – Sep 26</span>
        <div style={{flex:1}}></div>
        <span style={{color:'#888'}}>∑55pts / cap 290pts · 19%</span>
      </div>
      {/* Board */}
      <div style={{flex:1, overflow:'auto', padding:'8px 10px'}}>
        {/* Sprint header */}
        <div style={{display:'flex', borderBottom:'2px solid #ccc', marginBottom:4}}>
          <div style={{width:20, flexShrink:0}}></div>
          <div style={{width:80, flexShrink:0, fontSize:10, color:'#999', textAlign:'center', background:'#f0eeea', border:'1px solid #ddd', padding:'2px 4px'}}>Features</div>
          {sprintMeta.map((sp,i) => (
            <div key={i} style={{flex:1, borderLeft:'1.5px solid #ddd', textAlign:'center', padding:'3px 2px'}}>
              <div style={{fontWeight:700, fontSize:12}}>S{sp.n}</div>
              <div style={{fontSize:9, color:'#aaa', marginBottom:2}}>{sp.date}</div>
              <div style={{width:'80%', margin:'0 auto', height:3, background:'#ece9e4', borderRadius:2, overflow:'hidden'}}>
                <div style={{width:`${Math.min(sp.used/sp.cap,1)*100}%`, height:'100%', background: sp.used>sp.cap?'#dc2626':sp.used/sp.cap>0.85?'#f5a623':'#aaa', borderRadius:2}}></div>
              </div>
              <div style={{fontSize:9, marginTop:1}}>
                <span style={{color:'#666'}}>{sp.used}</span><span style={{color:'#bbb'}}>/{sp.cap}</span>
                <span style={{color:'#aaa', marginLeft:2}}>{Math.round(sp.used/sp.cap*100)}%</span>
              </div>
            </div>
          ))}
        </div>
        {/* Swimlanes */}
        {sampleSwimlanes.map((sl,si) => (
          <div key={si} style={{marginBottom:5, border:'1.5px solid #ccc', borderRadius:3, overflow:'hidden'}}>
            <div style={{display:'flex', alignItems:'center', background:'#f0eeea', borderBottom:'1.5px solid #ccc', padding:'4px 8px', gap:6}}>
              <span style={{fontSize:13, color:'#888', width:14}}>▾</span>
              <span style={{fontWeight:700, fontSize:13, flex:1}}>{sl.name}</span>
              <div style={{width:50, height:3, background:'#ddd', borderRadius:2, overflow:'hidden'}}>
                <div style={{width:`${Math.min(sl.effort/sl.cap,1)*100}%`, height:'100%', background:'#aaa', borderRadius:2}}></div>
              </div>
              <span style={{fontSize:10, color:'#888'}}>{sl.effort}/{sl.cap}pts</span>
              <span style={{fontSize:10, color:'#aaa'}}>{Math.round(sl.effort/sl.cap*100)}%</span>
            </div>
            <div style={{display:'flex', flexDirection:'row'}}>
              {/* Feature zone */}
              <div style={{width:80, flexShrink:0, padding:4, background:'#ebe9e5', borderRight:'1.5px solid #ccc', display:'flex', flexDirection:'column', gap:3}}>
                <FeaturePill title={si===0?'Auth':'API v2'} effort={si===0?21:21} warn={si===1}/>
                {si===0 && <FeaturePill title="Dashboard" effort={13}/>}
                <div style={{fontSize:9, color:'#ccc', textAlign:'center', border:'1px dashed #ccc', padding:2, borderRadius:2}}>+ drop</div>
              </div>
              {/* Sprint cols */}
              {sl.sprints.map((groups, spi) => (
                <ColComp key={spi} groups={groups}/>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
};

/* ─── Main App ─── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "screen": "PI Board",
  "option": "Option G"
}/*EDITMODE-END*/;

const App = () => {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const screen = tweaks.screen;
  const option = tweaks.option;

  const showAll = option === 'All options';

  return (
    <>
      <DesignCanvas>
        {(showAll || option === 'Option A') && (
          <DCSection id="A" title="Option A — Sidebar nav, horizontal swimlanes">
            <DCArtboard id="A1" label="Standard layout" width={900} height={580}>
              <OptionA screen={screen}/>
            </DCArtboard>
          </DCSection>
        )}
        {(showAll || option === 'Option B') && (
          <DCSection id="B" title="Option B — Top tab bar, collapsible swimlanes">
            <DCArtboard id="B1" label="Top nav, collapsed rows" width={900} height={580}>
              <OptionB screen={screen}/>
            </DCArtboard>
          </DCSection>
        )}
        {(showAll || option === 'Option C') && (
          <DCSection id="C" title="Option C — Icon sidebar + right detail rail">
            <DCArtboard id="C1" label="Icon dock + detail panel" width={900} height={580}>
              <OptionC screen={screen}/>
            </DCArtboard>
          </DCSection>
        )}
        {(showAll || option === 'Option D') && (
          <DCSection id="D" title="Option D — Persistent backlog drawer + board">
            <DCArtboard id="D1" label="Split: backlog left, board right" width={900} height={580}>
              <OptionD screen={screen}/>
            </DCArtboard>
          </DCSection>
        )}
        {(showAll || option === 'Option E') && (
          <DCSection id="E" title="Option E ★ Combined — Project list · Backlog · Collapsible swimlanes">
            <DCArtboard id="E1" label="Project list (1/3) + Backlog (2/3) + Board" width={1100} height={620}>
              <OptionE screen={screen}/>
            </DCArtboard>
          </DCSection>
        )}
        {(showAll || option === 'Option F') && (
          <DCSection id="F" title="Option F — Feature-as-row board (no separate feature zone)">
            <DCArtboard id="F1" label="Features as swimlane rows" width={1100} height={620}>
              <OptionF screen={screen}/>
            </DCArtboard>
          </DCSection>
        )}
        {(showAll || option === 'Option G') && (
          <DCSection id="G" title="Option G — Capacity bar visualization per swimlane">
            <DCArtboard id="G1" label="Visual capacity indicators + PI summary bar" width={1100} height={620}>
              <OptionG screen={screen}/>
            </DCArtboard>
            <DCArtboard id="G2" label="Sprint col variant A — Current: stacked group cards" width={700} height={480}>
              <SprintColVariants variant="A"/>
            </DCArtboard>
            <DCArtboard id="G3" label="Sprint col variant B — Compact: group pills, no PBI rows" width={700} height={480}>
              <SprintColVariants variant="B"/>
            </DCArtboard>
            <DCArtboard id="G4" label="Sprint col variant C — Kanban: PBIs as chips under group header" width={700} height={480}>
              <SprintColVariants variant="C"/>
            </DCArtboard>
          </DCSection>
        )}
        {(showAll || option === 'Option H') && (
          <DCSection id="H" title="Option H — Drag targets + inline group creation flow">
            <DCArtboard id="H1" label="Active drag state + highlighted drop zones" width={1100} height={620}>
              <OptionH screen={screen}/>
            </DCArtboard>
          </DCSection>
        )}
      </DesignCanvas>

      <TweaksPanel>
        <TweakSection title="Active Screen">
          <TweakRadio
            id="screen"
            options={['Backlog','PI Board','CSV Import','Dependencies']}
            value={screen}
            onChange={v => setTweak('screen', v)}
          />
        </TweakSection>
        <TweakSection title="Show Options">
          <TweakRadio
            id="option"
            options={['All options','Option A','Option B','Option C','Option D','Option E','Option F','Option G','Option H']}
            value={option}
            onChange={v => setTweak('option', v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
