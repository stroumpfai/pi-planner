[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-planning-backend"
version = "0.1.0"
description = "PI Planning Web Application — Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.1",
    "uvicorn[standard]>=0.49.0",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "aiosqlite>=0.22.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "argon2-cffi>=25.1.0",
    "itsdangerous>=2.2.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "matplotlib>=3.8",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "black>=26.5.1",
    "ruff>=0.15.20",
    "mypy>=2.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Warnings are a gate, like the coverage floor: both suites run clean, so a
# new one (a deprecation from a dependency bump, an un-awaited coroutine)
# fails here instead of scrolling past in the output.
filterwarnings = ["error"]
addopts = "--cov=app --cov-fail-under=75"

[tool.coverage.run]
core = "sysmon"
source = ["app"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
