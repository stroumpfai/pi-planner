# Branch coverage for scripts/test-report.sh. Not the default config (that's
# [tool.coverage] in pyproject.toml) because the two need different tracers:
#
# - The default run uses core = "sysmon", which is fast but on Python 3.12
#   cannot measure branches.
# - Branches need the C tracer, and the C tracer only sees code that runs
#   inside SQLAlchemy's async greenlets when told to (concurrency = greenlet).
#   Without that it under-reports by ~25 points. sysmon refuses that setting.
#
# Branch runs take ~70% longer, so check.sh keeps the fast line gate and the
# release report records lines + branches. Drop this file once the venv is on
# Python 3.14, where sysmon measures branches too.
[run]
branch = true
concurrency = greenlet, thread
source = app

[report]
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
