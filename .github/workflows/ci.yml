name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-lint:
    name: Frontend ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  frontend-typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Covers every spec as well as src — two tsc runs, since the Cypress
      # specs need their own project (its globals and Vitest's cannot share one
      # program). `npm run build` only checks tsconfig.app.json, which excludes
      # __tests__, and Cypress strips types rather than checking them — so
      # without this a spec can drift from the API types (asserting payloads the
      # backend would reject) while lint and the suite both stay green.
      - name: Typecheck (including tests)
        run: npm run typecheck
