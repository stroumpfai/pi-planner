[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["mcp_server*"]

[project]
name = "pi-planner-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.2",
    "httpx>=0.28.1",
    "pyjwt>=2.13.0",
    "argon2-cffi>=25.1.0",
    "pydantic-settings>=2.14.2",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "anyio[trio]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Warnings are a gate, like the coverage floor: both suites run clean, so a
# new one (a deprecation from a dependency bump, an un-awaited coroutine)
# fails here instead of scrolling past in the output.
filterwarnings = ["error"]
addopts = "--cov=mcp_server --cov-fail-under=80 --cov-report=term-missing"

[tool.coverage.run]
source = ["mcp_server"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
