services:
  app:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data/:/data
      - ./config:/config:ro
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/db.sqlite
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000}
      USERS_FILE: /config/users.json
    restart: unless-stopped

  mcp-server:
    build: ./mcp_server
    env_file: ./mcp_server/.env
    ports:
      - "8010:8010"
    environment:
      BACKEND_URL: http://app:8000
      FASTMCP_HOST: "0.0.0.0"
    depends_on:
      - app
    restart: unless-stopped
